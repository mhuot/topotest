! site1 configuration
hostname site1

! Enable SNMP
snmp-server community public ro
snmp-server location Lab
snmp-server contact admin@lab.local

! Enable LLDP
lldp run

! Management interface
interface Management0
   ip address 192.168.1.104/24
   no shutdown

! Inter-device links
interface Ethernet1
   description link to hub1
   no switchport
   ip address 10.0.14.2/30
   no shutdown

interface Ethernet2
   description link to hub2
   no switchport
   ip address 10.0.24.2/30
   no shutdown

interface Ethernet3
   description link to sub1
   no switchport
   ip address 10.0.34.2/30
   no shutdown

! Enable IP routing
ip routing

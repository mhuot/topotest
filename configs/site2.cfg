! site2 configuration
hostname site2

! Enable SNMP
snmp-server community public ro
snmp-server location Lab
snmp-server contact admin@lab.local

! Enable LLDP
lldp run

! Management interface
interface Management0
   ip address 192.168.1.105/24
   no shutdown

! Inter-device links
interface Ethernet1
   description link to hub1
   no switchport
   ip address 10.0.15.2/30
   no shutdown

interface Ethernet2
   description link to hub2
   no switchport
   ip address 10.0.25.2/30
   no shutdown

! Enable IP routing
ip routing

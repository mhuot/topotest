# LLDP discovery demo topology for walktopo / lldp-me testing
# Uses Nokia SR Linux (~500MB each) — free image, auto-pulled from ghcr.io
# 5 nodes in a 3-tier architecture (core / distribution / edge)
# 7 links with redundant paths — complex enough for realistic LLDP walks
# SNMP (community public) and LLDP are enabled by default
#
# Topology:
#
#            core
#           /    \
#        dist1---dist2
#        / \      / \
#     edge1  edge2
#
# Deploy: ./lab.sh --lldp deploy
#     or: sudo containerlab deploy -t topology-lldp.clab.yml

name: topotest-lldp

topology:
  defaults:
    kind: srl
    image: ghcr.io/nokia/srlinux:latest

  nodes:
    core:
      startup-config: configs/lldp/core.cfg
    dist1:
      startup-config: configs/lldp/dist1.cfg
    dist2:
      startup-config: configs/lldp/dist2.cfg
    edge1:
      startup-config: configs/lldp/edge1.cfg
    edge2:
      startup-config: configs/lldp/edge2.cfg

  links:
    # Core to distribution layer
    - endpoints: ["core:e1-1", "dist1:e1-1"]
    - endpoints: ["core:e1-2", "dist2:e1-1"]

    # Inter-distribution cross-link
    - endpoints: ["dist1:e1-2", "dist2:e1-2"]

    # Distribution to edge (dual-homed for redundancy)
    - endpoints: ["dist1:e1-3", "edge1:e1-1"]
    - endpoints: ["dist1:e1-4", "edge2:e1-1"]
    - endpoints: ["dist2:e1-3", "edge1:e1-2"]
    - endpoints: ["dist2:e1-4", "edge2:e1-2"]

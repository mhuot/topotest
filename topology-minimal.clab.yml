# Minimal lightweight topology for walktopo SNMP/LLDP testing
# Uses Alpine Linux containers (~50MB each vs ~1.5GB for cEOS)

name: topotest-minimal

topology:
  defaults:
    kind: linux
    image: alpine:3.21

  nodes:
    switch1:
      exec:
        - apk add --no-cache lldpd net-snmp net-snmp-tools
        - echo 'master agentx' > /etc/snmp/snmpd.conf
        - echo 'rocommunity public' >> /etc/snmp/snmpd.conf
        - echo 'syslocation Lab-Switch1' >> /etc/snmp/snmpd.conf
        - echo 'syscontact admin@lab.local' >> /etc/snmp/snmpd.conf
        - snmpd -Lf /var/log/snmpd.log
        - lldpd -M 4

    switch2:
      exec:
        - apk add --no-cache lldpd net-snmp net-snmp-tools
        - echo 'master agentx' > /etc/snmp/snmpd.conf
        - echo 'rocommunity public' >> /etc/snmp/snmpd.conf
        - echo 'syslocation Lab-Switch2' >> /etc/snmp/snmpd.conf
        - echo 'syscontact admin@lab.local' >> /etc/snmp/snmpd.conf
        - snmpd -Lf /var/log/snmpd.log
        - lldpd -M 4

    switch3:
      exec:
        - apk add --no-cache lldpd net-snmp net-snmp-tools
        - echo 'master agentx' > /etc/snmp/snmpd.conf
        - echo 'rocommunity public' >> /etc/snmp/snmpd.conf
        - echo 'syslocation Lab-Switch3' >> /etc/snmp/snmpd.conf
        - echo 'syscontact admin@lab.local' >> /etc/snmp/snmpd.conf
        - snmpd -Lf /var/log/snmpd.log
        - lldpd -M 4

  links:
    - endpoints: ["switch1:eth1", "switch2:eth1"]
    - endpoints: ["switch2:eth2", "switch3:eth1"]
    - endpoints: ["switch3:eth2", "switch1:eth2"]

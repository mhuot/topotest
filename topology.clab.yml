name: topotest

topology:
  nodes:
    hub1:
      kind: ceos
      image: ceosarm:4.35.1F
      startup-config: configs/hub1.cfg

    hub2:
      kind: ceos
      image: ceosarm:4.35.1F
      startup-config: configs/hub2.cfg

    sub1:
      kind: ceos
      image: ceosarm:4.35.1F
      startup-config: configs/sub1.cfg

    site1:
      kind: ceos
      image: ceosarm:4.35.1F
      startup-config: configs/site1.cfg

    site2:
      kind: ceos
      image: ceosarm:4.35.1F
      startup-config: configs/site2.cfg

  links:
    # Hub1 connections
    - endpoints: ["hub1:eth1", "hub2:eth1"]
    - endpoints: ["hub1:eth2", "sub1:eth1"]
    - endpoints: ["hub1:eth3", "site1:eth1"]
    - endpoints: ["hub1:eth4", "site2:eth1"]

    # Hub2 connections
    - endpoints: ["hub2:eth2", "sub1:eth2"]
    - endpoints: ["hub2:eth3", "site1:eth2"]
    - endpoints: ["hub2:eth4", "site2:eth2"]

    # sub1 to site1
    - endpoints: ["sub1:eth3", "site1:eth3"]
